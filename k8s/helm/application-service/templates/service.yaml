apiVersion: v1
kind: Service
metadata:
  name: "{{ .Release.Name }}-application-service"
  namespace: "{{ .Release.Namespace }}"
  labels:
    app.kubernetes.io/name: application-service
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/managed-by: "{{ .Release.Service }}"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: application-service
    app.kubernetes.io/instance: "{{ .Release.Name }}"
  ports:
    - name: http
      port: 8082
      targetPort: 8082
      protocol: TCP