apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: "{{ .Release.Name }}-application-service-rolebinding"

subjects:
  - kind: ServiceAccount
    name: "{{ .Release.Name }}-application-service-account"
    namespace: "{{ .Release.Namespace }}"

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: "{{ .Release.Name }}-application-service-role"