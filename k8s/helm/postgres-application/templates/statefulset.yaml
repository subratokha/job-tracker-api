apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: "{{ include "postgresApplication.name" . }}"
spec:
  serviceName: {{ include "postgresApplication.serviceName" . }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-application
      app.kubernetes.io/instance: "{{ .Release.Name }}"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-application
        app.kubernetes.io/instance: "{{ .Release.Name }}"
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
        app.kubernetes.io/managed-by: "{{ .Release.Service }}"
    spec:
      containers:
        - name: postgres-application
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: "{{ .Values.image.pullPolicy }}"
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: "{{ .Release.Name }}-postgres-application-secret"
          env:
            - name: POSTGRES_DB
              value: application_service
          volumeMounts:
            - name: postgres-application-storage
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            periodSeconds: 5
            failureThreshold: 3
          startupProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            failureThreshold: 15
            periodSeconds: 2
          resources:
            requests:
              cpu: "{{ .Values.resources.requests.cpu }}"
              memory: "{{ .Values.resources.requests.memory }}"
            limits:
              cpu: "{{ .Values.resources.limits.cpu }}"
              memory: "{{ .Values.resources.limits.memory }}"
  volumeClaimTemplates:
    - metadata:
        name: postgres-application-storage
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.storage.size }}
